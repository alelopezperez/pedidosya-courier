[package]
name = "pedidosya-courier"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial async Rust client for the PedidosYa Courier API (v3): shippings, estimates, coverage and webhooks"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["pedidosya", "courier", "delivery", "shipping", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]
# repository = "https://github.com/<owner>/pedidosya-courier"   # set before publishing
# documentation defaults to docs.rs once published
# Tests and their fixtures stay in the repository, not in the published package.
exclude = ["tests/", "clippy.toml"]

# Self-contained on purpose (no workspace inheritance), so the crate can move
# to its own repository without changes.

[features]
default = ["rustls"]
## TLS backend: rustls (pure Rust, default)
rustls = ["reqwest/rustls"]
## TLS backend: the platform's native TLS (OpenSSL on Linux)
native-tls = ["reqwest/native-tls"]

[dependencies]
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
